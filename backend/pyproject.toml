[project]
name = "ragforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JehanDesai", email = "jehan.hemang.desai@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ragforge = "ragforge:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length=100
target-version="py314"

[tool.ruff.lint]
select=["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
